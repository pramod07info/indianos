[package]
name = "indianos-user"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "indianos-user"
path = "src/main.rs"
test = false
bench = false

[[test]]
name = "shell_commands"
path = "tests/shell_commands.rs"

[dependencies]

[features]
default = []
demo = []
worker = []
shell = []
interactive = []
sched-a = []
sched-b = []
ipc-a = []
ipc-b = []
r026-shell = []
r026-worker = []
r029-client = []
r029-physical = ["r029-client"]
r029-files = []
r029-terminal = []
r029-frame-server = []
r029-frame-client = []
r029-suite-shell = []
r029-suite-files = []
r029-suite-terminal = []
r031-shell = []
r031-files = []
r031-terminal = []
r031-supervisor-shell = []
r031-supervisor-files = []
r031-supervisor-terminal = []
r031-vfs-init = []
r031-vfs-worker = []
# Signed R030 native SDK sample application, two independently versioned ELFs.
r030-demo-v1 = []
r030-demo-v2 = []
r030-ondevice-init = []
r030-ondevice-app = []
r025-a = []
r025-b = []
fault-guard = []
fault-supervisor = []
preempt-a = []
preempt-b = []

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
overflow-checks = true
