[package]
name = "indianos-user"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "indianos-user"
path = "src/main.rs"
test = false
bench = false

[[test]]
name = "shell_commands"
path = "tests/shell_commands.rs"

[dependencies]

[features]
default = []
demo = []
worker = []
shell = []
sched-a = []
sched-b = []
fault-guard = []
fault-supervisor = []
preempt-a = []
preempt-b = []

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
overflow-checks = true
