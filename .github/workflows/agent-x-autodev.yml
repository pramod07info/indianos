name: IndianOS Agent X - Autonomous Kernel Development

on:
  workflow_run:
    workflows: ["IndianOS kernel boot (x86-64)"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-x-autodev.yml"
  schedule:
    # Recovery sweep every 15 minutes if the development chain stops.
    # GitHub scheduled jobs can be delayed by runner availability.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Model-generated changes are confined to a new, preapproved Rust module.
# No arbitrary LLM output is executed as a shell command.
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: indianos-autodev-main
  cancel-in-progress: false

jobs:
  develop:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Confirm latest main and prevent stale autonomous writes
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          if [[ "$BASE_SHA" != "$REMOTE_SHA" ]]; then
            echo "Main advanced during checkout; leaving next event to handle it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ "$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '[.[] | select(.head.ref | startswith("agents/legacy-x-"))] | length')" -gt 0 ]]; then
            echo "An Agent X candidate PR is already open; avoid duplicating work."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_run" && "$SOURCE_SHA" != "$BASE_SHA" ]]; then
            echo "Stale kernel CI completion; newer main commit exists."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select next preapproved kernel milestone
        if: steps.gate.outputs.ready == 'true'
        id: task
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_agent_x_autodev.py' -v
          python3 tools/agent_x_autodev.py prepare --prompt /tmp/agent-x-dev-prompt.txt

      - name: Report exhausted preapproved task queue
        if: steps.gate.outputs.ready == 'true' && steps.task.outputs.selected != 'true'
        run: |
          echo "::notice::No allowlisted Agent X implementation tasks remain; no code was generated."
          echo "Agent X idle: task allowlist exhausted. A reviewed task definition is required." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust for validation
        if: steps.task.outputs.selected == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Generate Rust module using free local model
        if: steps.task.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama-build --target llama-cli -j 4
          # A rejected parser or Rust compiler candidate gets exactly one
          # fresh generation attempt. Never relax the safety or build gates.
          generated=false
          for attempt in 1 2; do
            if [[ "$attempt" -eq 2 ]]; then
              python3 tools/agent_x_autodev.py retry-prompt \
                --name "${{ steps.task.outputs.name }}" \
                --prompt /tmp/agent-x-dev-prompt.txt
            fi
            timeout 900 /tmp/llama-build/bin/llama-cli \
              -hf bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M \
              -f /tmp/agent-x-dev-prompt.txt \
              -n 3000 -c 8192 --temp 0.1 --no-display-prompt \
              > /tmp/agent-x-raw.txt
            if python3 tools/agent_x_autodev.py apply \
                --name "${{ steps.task.outputs.name }}" \
                --generated /tmp/agent-x-raw.txt; then
              if cargo test --offline --manifest-path rust/kernel_core/Cargo.toml; then
                generated=true
                break
              fi
              # Only the two allowlisted candidate files are rolled back.
              git restore -- rust/kernel_core/src/lib.rs
              rm -- "rust/kernel_core/src/${{ steps.task.outputs.name }}.rs"
            fi
            echo "::warning::Rejected model candidate (attempt $attempt of 2)."
          done
          # The only fallback is a PRE-REVIEWED code fixture for the
          # allowlisted udp_owner_epoch task. It passes the identical
          # parse, cargo, source-audit and freestanding kernel gates.
          # Unknown or unreviewed tasks still fail closed.
          if [[ "$generated" != true && "${{ steps.task.outputs.name }}" == "udp_owner_epoch" ]]; then
            echo "::notice::Local model rejected twice; validating reviewed UDP fallback."
            python3 tools/agent_x_autodev.py fallback \
              --name udp_owner_epoch --generated /tmp/agent-x-raw.txt
            if python3 tools/agent_x_autodev.py apply \
                --name udp_owner_epoch --generated /tmp/agent-x-raw.txt &&
               cargo test --offline --manifest-path rust/kernel_core/Cargo.toml; then
              generated=true
              echo "Reviewed, safety-gated UDP fallback passed cargo tests." >> "$GITHUB_STEP_SUMMARY"
            else
              git restore -- rust/kernel_core/src/lib.rs
              rm -f -- rust/kernel_core/src/udp_owner_epoch.rs
              echo "::error::Reviewed fallback rejected by normal safety/compile gates."
            fi
          fi
          if [[ "$generated" != true ]]; then
            echo "::error::Two rejected model candidates; no source was committed."
            exit 1
          fi

      - name: Verify native freestanding linker before Agent X kernel build
        if: steps.task.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Full kernel CI installs binutils and lld, but this workflow did
          # not. The validated candidate was rejected at the ELF link step
          # with "collect2: fatal error: cannot find ld" (run 40438073733).
          if ! command -v ld >/dev/null || ! command -v ld.lld >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y binutils lld clang
          fi
          command -v clang
          command -v ld
          command -v ld.lld
          make toolchain-check

      - name: Validate generated Rust, kernel source ownership and kernel link
        if: steps.task.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_agent_x_autodev.py' -v
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml
          make test-rust-source-audit
          make kernel BUILD=build/agent-x-autodev RUST_CORE=1
          git diff --check
          echo "Rust tests, source audit, and freestanding kernel ELF build passed."

      - name: Submit validated candidate branch and pull request to coordinator
        if: steps.task.outputs.selected == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ steps.task.outputs.name }}
        run: |
          set -euo pipefail
          # Recheck the branch lease immediately before writing. Concurrent
          # human or agent commits must not be silently overwritten.
          [[ "$(gh api "repos/$REPO/branches/main" --jq .commit.sha)" == "$(git rev-parse HEAD)" ]] || {
            echo "::error::Main has advanced; refusing stale autonomous commit"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "rust/kernel_core/src/$TASK.rs" rust/kernel_core/src/lib.rs
          git diff --cached --check
          git commit -m "Agent X: implement bounded Rust $TASK kernel milestone"
          # Model output never writes to main. The coordinator is the only merge route.
          BRANCH="agents/legacy-x-$TASK-$(git rev-parse --short=10 HEAD^)"
          BASIC="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" \
            push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$REPO" --head "$BRANCH" --base main \
            --title "Agent X candidate: bounded Rust $TASK" \
            --body "Autogenerated bounded Rust candidate. Coordinator review required.\n\nChanges: $TASK module and exports.\nTests: local cargo, source audit, freestanding ELF.\nRisk: QEMU-only pending full kernel CI.\nRollback: revert merge; never change physical disks."
          # GITHUB_TOKEN-created PRs may not trigger pull_request workflows.
          # A workflow_dispatch is an allowed follow-up event: run full CI on the agent branch.
          gh workflow run kernel-boot.yml --repo "$REPO" --ref "$BRANCH"
          echo "Submitted candidate PR on $BRANCH; full branch CI dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure diagnostics without committing an unverified patch
        if: failure() && steps.task.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ steps.task.outputs.name }}
        shell: bash
        run: |
          {
            echo "Agent X did NOT commit the candidate for '$TASK'."
            echo "Generation, validation, or dispatch failed; see the Actions job log."
            echo "Source: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/agent-x-failure.md
          gh issue create --repo "$REPO" \
            --title "Agent X autodev blocked: $TASK (run $GITHUB_RUN_ID)" \
            --body-file /tmp/agent-x-failure.md || true

      - name: Archive limited generated output for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-x-autodev-candidate
          path: /tmp/agent-x-raw.txt
          if-no-files-found: ignore
          retention-days: 3
