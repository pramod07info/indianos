name: IndianOS Coordinator - Agent PR Review and Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_run:
    workflows: ["IndianOS kernel boot (x86-64)"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Trusted base-branch workflow only. NEVER check out or execute PR code here.
# Approval label + independent review + green full CI + fresh main gate.
permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: indianos-coordinator-main
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect queued agent PRs and merge only fully reviewed changes
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const owned = ref => /^agents\/(?:0[1-9]|10)-[a-z0-9-]+$/.test(ref) ||
                                   /^agents\/legacy-x-[a-z0-9_-]+$/.test(ref);
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100
            });
            const branch = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const mainSHA = branch.data.commit.sha;
            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: mainSHA, per_page: 100
            });
            const mainGreen = allRuns.some(run =>
              run.name === 'IndianOS kernel boot (x86-64)' &&
              run.head_sha === mainSHA &&
              run.head_branch === 'main' &&
              ['push','workflow_dispatch'].includes(run.event) &&
              run.status === 'completed' && run.conclusion === 'success');
            if (!mainGreen) {
              core.warning('Current main has no verified full-kernel green run. Block all merges.');
              return;
            }
            for (const pr of prs) {
              const ref = pr.head.ref;
              if (!owned(ref) || pr.head.repo?.full_name !== context.repo.owner + '/' + repo) continue;
              if (pr.draft) { core.info('#' + pr.number + ': draft'); continue; }
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: pr.number, per_page: 100
                });
                const privileged = files.some(f => f.filename.startsWith('.github/') ||
                  f.filename.startsWith('boot/') || f.filename.includes('.env'));
                // Workflow, boot and credential changes always require an explicitly reviewed approval.
                const changeSafe = files.length > 0 && files.length <= 50 &&
                  files.every(f => (f.changes ?? 0) <= 3000 && f.status !== 'removed');
                if (!changeSafe) {
                  core.warning('#' + pr.number + ': change size or deletion policy review required');
                  continue;
                }
                // Auto-review only one safe additive module in a preapproved slot.
                // All other work requires a separate GitHub reviewer approval.
                const moduleFile = files.length === 1 && files[0].filename.match(
                  /^rust\/kernel_core\/src\/agent_([0-9]{2})_[a-z0-9_]+\.rs$/);
                let boundedAutoReview = false;
                if (moduleFile && ref.startsWith('agents/' + moduleFile[1] + '-') &&
                    files[0].status === 'modified' && files[0].changes <= 500) {
                  const sourceResult = await github.rest.repos.getContent({
                    owner, repo, path: files[0].filename, ref: pr.head.sha
                  });
                  const code = Buffer.from(sourceResult.data.content, 'base64').toString('utf8');
                  const banned = /\b(?:unsafe|extern|static\s+mut)\b|\bstd\s*::|#\s*\[\s*(?:path|link|no_mangle)|\b(?:asm|include|env|global_asm)\s*!/i;
                  boundedAutoReview = code.length >= 300 && code.length <= 15000 &&
                    code.includes('pub fn') && code.includes('#[cfg(test)]') &&
                    (code.match(/#\[test\]/g) || []).length >= 3 &&
                    !banned.test(code) && !/#!\s*\[/.test(code);
                }
                if (!boundedAutoReview) {
                  const approvalLabel = pr.labels.some(l => l.name === 'coordinator-approved');
                  if (!approvalLabel) {
                    core.info('#' + pr.number + ': privileged or non-bounded PR needs label and independent review');
                    continue;
                  }
                  const reviews = await github.paginate(github.rest.pulls.listReviews,{
                    owner,repo,pull_number:pr.number,per_page:100
                  });
                  const latest = new Map();
                  for (const r of reviews) latest.set(r.user.login, r);
                  const independentApproval = [...latest].some(([login,r]) =>
                    login !== pr.user.login && r.state === 'APPROVED' &&
                    r.commit_id === pr.head.sha);
                  if (!independentApproval) {
                    core.info('#' + pr.number + ': awaiting independent approving code review');
                    continue;
                  }
                }
                if (privileged) core.notice('#' + pr.number + ': privileged files independently approved');
                const checks = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{
                  owner,repo,head_sha:pr.head.sha,per_page:100
                });
                // Evaluate the newest exact-head kernel run, not an earlier
                // success that may have been superseded by a failed rerun.
                // Ignore unrelated workflows, stale SHAs and untrusted repos.
                const relevant = checks.filter(run =>
                  run.name === 'IndianOS kernel boot (x86-64)' &&
                  ['pull_request','workflow_dispatch'].includes(run.event) &&
                  run.head_sha === pr.head.sha &&
                  run.head_repository?.full_name === owner + '/' + repo
                ).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                const newest = relevant[0];
                const ciPassed = newest?.status === 'completed' &&
                  newest.conclusion === 'success';
                if (!ciPassed) {
                  core.info('#' + pr.number + ': full-kernel QEMU CI not green for exact head SHA');
                  continue;
                }
                // Require a separate fail-closed checkout-identity check on
                // the exact current PR head, not only the large kernel QEMU job.
                const shaRuns = checks.filter(run =>
                  run.name === 'Roadmap SHA Validation' &&
                  ['pull_request', 'workflow_dispatch'].includes(run.event) &&
                  run.head_sha === pr.head.sha &&
                  run.head_repository?.full_name === owner + '/' + repo
                ).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                const latestSha = shaRuns[0];
                if (!latestSha || latestSha.status !== 'completed' ||
                    latestSha.conclusion !== 'success') {
                  core.info('#' + pr.number + ': exact-head SHA validation missing or failed');
                  continue;
                }
                const livePR = (await github.rest.pulls.get({
                  owner,repo,pull_number:pr.number
                })).data;
                if (livePR.head.sha !== pr.head.sha || livePR.base.sha !== mainSHA ||
                    livePR.mergeable !== true) {
                  core.info('#' + pr.number + ': PR stale, conflicting or mergeability pending');
                  continue;
                }
                const cmp = (await github.rest.repos.compareCommits({
                  owner,repo,base:'main',head:pr.head.sha
                })).data;
                if (cmp.merge_base_commit.sha !== mainSHA) {
                  // Reconcile disjoint, bounded code branches without force pushing.
                  // The branch update changes the SHA and invalidates previous CI.
                  if (boundedAutoReview) {
                    try {
                      await github.rest.pulls.updateBranch({
                        owner, repo, pull_number:pr.number, expected_head_sha:pr.head.sha
                      });
                      await github.rest.actions.createWorkflowDispatch({
                        owner, repo, workflow_id:'kernel-boot.yml', ref:ref
                      });
                      core.notice('#' + pr.number + ': updated onto main and started fresh QEMU CI');
                    } catch (err) {
                      core.warning('#' + pr.number + ': unable to refresh branch: ' + err.message);
                    }
                  } else {
                    core.info('#' + pr.number + ': needs maintainer rebase onto main');
                  }
                  continue;
                }
                if (boundedAutoReview) {
                  await github.rest.issues.createComment({
                    owner,repo,issue_number:pr.number,
                    body:'Coordinator automated structural review passed at '+pr.head.sha+
                      '. Single bounded Rust module, static guards and full QEMU CI passed. '+
                      'Not an independent human security review.'
                  });
                }
                await github.rest.pulls.merge({
                  owner,repo,pull_number:pr.number,sha:pr.head.sha,merge_method:'squash',
                  commit_title:'Coordinator: merge verified agent PR #' + pr.number
                });
                core.notice('Merged verified agent PR #' + pr.number + '; run complete CI on new main');
                await github.rest.actions.createWorkflowDispatch({
                  owner,repo,workflow_id:'kernel-boot.yml',ref:'main'
                });
                break; // One change at a time; wait for main full CI before next merge.
              } catch (err) {
                core.warning('#' + pr.number + ': gate failed: ' + err.message);
              }
            }
