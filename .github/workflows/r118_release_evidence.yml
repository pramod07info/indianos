name: R118 release evidence unit tests

# Mandatory on every PR, not only when the Python gate changes.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-evidence-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected PR commit
        uses: actions/checkout@v4
      - name: Verify Python evidence gate regressions
        run: python3 -m unittest -v scripts/test_r118_release_gate.py
