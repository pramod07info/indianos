name: IndianOS Agent X - Free Local Model Prototype

on:
  workflow_run:
    workflows: ["IndianOS kernel boot (x86-64)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed kernel workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: indianos-local-agent
  cancel-in-progress: false

jobs:
  agent-x:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch completed CI context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$EVENT_RUN_ID"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then RUN_ID="$MANUAL_RUN_ID"; fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid kernel run ID"; exit 1; }
          # workflow_run now points directly to the completed kernel run.
          # No SHA matching, polling, or dependence on Agent Y timing.
          gh api "repos/$REPO/actions/runs/$RUN_ID" > /tmp/ci-run.json
          [[ "$(jq -r .head_branch /tmp/ci-run.json)" == "main" ]] || exit 1
          [[ "$(jq -r .status /tmp/ci-run.json)" == "completed" ]] || exit 1
          [[ "$(jq -r .path /tmp/ci-run.json)" == ".github/workflows/kernel-boot.yml" ]] || { echo "::error::Not a kernel CI run"; exit 1; }
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/ci-jobs.json
          : > /tmp/ci-failure-logs.txt
          if [[ "$(jq -r '.conclusion' /tmp/ci-run.json)" != "success" ]]; then
            jq -r '[.jobs[] | select(.conclusion == "failure") | .id][:5][]' /tmp/ci-jobs.json | while read -r JOB_ID; do
              echo "=== Failed job $JOB_ID ===" >> /tmp/ci-failure-logs.txt
              if gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/agent-x-job.log 2>/dev/null; then
                tail -c 12000 /tmp/agent-x-job.log >> /tmp/ci-failure-logs.txt
              else
                echo "Job logs unavailable" >> /tmp/ci-failure-logs.txt
              fi
            done
          fi
          python3 tools/agent_x_ci_context.py /tmp/ci-run.json /tmp/ci-jobs.json /tmp/ci-failure-logs.txt > /tmp/agent-prompt.txt
      - name: Build CPU-only llama.cpp
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build -DGGML_NATIVE=OFF -DLLAMA_CURL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama-build --target llama-cli -j 4
      - name: Analyze CI with free coding model (no credentials)
        run: |
          set -euo pipefail
          timeout 600 /tmp/llama-build/bin/llama-cli \
            -hf bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M \
            -f /tmp/agent-prompt.txt -n 600 -c 4096 --temp 0.1 \
            --no-display-prompt > agent-x-report.txt
          cat agent-x-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish actionable Agent X report
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## IndianOS Agent X diagnosis"
            echo
            echo "Source kernel CI: $(jq -r .html_url /tmp/ci-run.json)"
            echo "Result: $(jq -r .conclusion /tmp/ci-run.json)"
            echo
            echo '### Agent X analysis'
            cat agent-x-report.txt
            echo
            echo "This is a proposed plan, not an applied patch."
          } > /tmp/agent-x-issue.md
          gh issue create --repo "$REPO" --title "Agent X: CI analysis for run $(jq -r .id /tmp/ci-run.json)" --body-file /tmp/agent-x-issue.md

      - name: Preserve Agent X diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-x-ci-diagnosis
          path: agent-x-report.txt
          if-no-files-found: ignore
          retention-days: 7

# Deliberately read-only until model reliability, test gates, and safe
# bounded patch application are demonstrated. Never execute model output.
