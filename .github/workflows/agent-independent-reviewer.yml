name: IndianOS Independent Reviewer Agent
# Trusted base only; never check out or run untrusted PR code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["IndianOS kernel boot (x86-64)"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: indianos-independent-reviewer
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review bounded security modules against independent policy and CI
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo, full=owner+'/'+repo;
            const policy={
              175:{branch:'agents/05-cap-revocation-recovery',
                paths:['rust/kernel_core/src/agent_03_cap_epoch.rs'],tests:5,
                evidence:['pub fn revoke_owned(','authorize(grant,request)?;',
                  'Ok(Grant{revoked:true,..grant})',
                  'revocation_invalidates_existing_grant',
                  'stale_generation_and_foreign_owner_cannot_revoke',
                  'rights_escalation_and_resource_spoofing_fail',
                  'a_zero_rights_request_never_revokes',
                  'epoch_replay_cannot_revoke_newer_grant']},
              172:{branch:'agents/legacy-x-udp_owner_epoch-b0ac4ba108',
                paths:['rust/kernel_core/src/lib.rs','rust/kernel_core/src/udp_owner_epoch.rs'],tests:2,
                source:'rust/kernel_core/src/udp_owner_epoch.rs',
                evidence:['pub struct Registry<const N:usize>','pub fn bind(',
                  'pub fn authorize(','pub fn revoke_owner(',
                  'item.pid==pid && item.generation==generation',
                  'binds_and_authorizes_only_current_generation',
                  'refuses_invalid_owners_ports_and_capacity_exhaustion']},
              181:{branch:'agents/03-cap-rights-intersect',
                paths:['rust/kernel_core/src/agent_03_cap_epoch.rs'],tests:3,dependency:175,
                evidence:['pub fn intersect_grants(',
                  'authorize(a,request)?;authorize(b,request)?;',
                  'let rights=a.rights&b.rights;',
                  'only_shared_rights_survive','stale_epoch_is_denied',
                  'revoked_or_unowned_grants_are_denied']}
            };
            const banned=/\b(?:unsafe|extern)\b|\bstatic\s+mut\b|\bstd\s*::|#\s*\[\s*(?:path|link|no_mangle)\b|\b(?:asm|global_asm|include|include_bytes|include_str|env|option_env)\s*!/i;
            const main=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            const getRuns=sha=>github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {owner,repo,head_sha:sha,per_page:100});
            const newest=(runs,name,sha,events)=>
              runs.filter(r=>r.name===name&&r.head_sha===sha&&
                events.includes(r.event)&&r.head_repository?.full_name===full)
              .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
            const green=r=>r?.status==='completed'&&r.conclusion==='success';
            const mainRun=newest(await getRuns(main),'IndianOS kernel boot (x86-64)',
              main,['push','workflow_dispatch']);
            if(!green(mainRun)){core.info('Current main full QEMU not green');return;}
            const prs=await github.paginate(github.rest.pulls.list,
              {owner,repo,state:'open',base:'main',per_page:100});
            for(const pr of prs){
              const p=policy[pr.number];
              if(!p||pr.draft||pr.head.ref!==p.branch||
                pr.head.repo?.full_name!==full||pr.user.login!==owner)continue;
              try{
                if(p.dependency){
                  const dep=(await github.rest.pulls.get(
                    {owner,repo,pull_number:p.dependency})).data;
                  if(!dep.merged){core.info('#'+pr.number+': dependency open');continue;}
                }
                const files=await github.paginate(github.rest.pulls.listFiles,
                  {owner,repo,pull_number:pr.number,per_page:100});
                if(JSON.stringify(files.map(f=>f.filename).sort())!==
                    JSON.stringify([...p.paths].sort())||
                  files.some(f=>f.deletions!==0||f.changes>250||!f.patch||
                    f.status==='removed')){
                  core.warning('#'+pr.number+': unexpected diff');continue;
                }
                const diff=(await github.rest.repos.compareCommits(
                  {owner,repo,base:'main',head:pr.head.sha})).data;
                if(diff.merge_base_commit.sha!==main){
                  core.info('#'+pr.number+': update to latest main first');continue;
                }
                const src=(await github.rest.repos.getContent(
                  {owner,repo,path:p.source||p.paths[0],ref:pr.head.sha})).data;
                if(Array.isArray(src)||src.type!=='file')continue;
                const code=Buffer.from(src.content,'base64').toString('utf8');
                const add=files.flatMap(f=>f.patch.split('\n').filter(l=>
                  l.startsWith('+')&&!l.startsWith('+++')).map(l=>l.slice(1))).join('\n');
                if(code.length>18000||banned.test(add)||
                    (add.match(/#\s*\[\s*test\s*\]/g)||[]).length<p.tests||
                    p.evidence.some(s=>!add.includes(s))){
                  core.warning('#'+pr.number+': code evidence test failed');continue;
                }
                if(pr.number===172){
                  const lib=files.find(f=>f.filename==='rust/kernel_core/src/lib.rs');
                  const lines=lib.patch.split('\n').filter(l=>
                    l.startsWith('+')&&!l.startsWith('+++'));
                  if(lines.length!==1||lines[0].trim()!=='+pub mod udp_owner_epoch;'){
                    core.warning('#172: unexpected kernel export');continue;
                  }
                }
                const runs=await getRuns(pr.head.sha);
                const pass=n=>green(newest(runs,n,pr.head.sha,
                  ['pull_request','workflow_dispatch']));
                if(!pass('IndianOS kernel boot (x86-64)')||
                   !pass('IndianOS Security Gate (S0)')||
                   !pass('Roadmap SHA Validation')){
                  core.info('#'+pr.number+': exact-head CI not green');continue;
                }
                const live=(await github.rest.pulls.get(
                  {owner,repo,pull_number:pr.number})).data;
                if(live.draft||live.head.sha!==pr.head.sha||
                  live.base.sha!==main||live.mergeable!==true)continue;
                const reviews=await github.paginate(github.rest.pulls.listReviews,
                  {owner,repo,pull_number:pr.number,per_page:100});
                const already=reviews.some(r=>r.user.login==='github-actions[bot]'&&
                  r.state==='APPROVED'&&r.commit_id===pr.head.sha);
                if(!already){
                  try{
                    await github.rest.pulls.createReview({owner,repo,
                      pull_number:pr.number,commit_id:pr.head.sha,event:'APPROVE',
                      body:'Independent AUTOMATED bot review (not a human). '+
                        'Allowlisted additive Rust changes and negative test evidence checked; '+
                        'exact-head kernel/QEMU, S0, SHA and current-main QEMU green. '+
                        'Approved only at commit '+pr.head.sha+'.'});
                  }catch(e){
                    core.warning('#'+pr.number+': bot approval unavailable: '+
                      e.message+'. Check repo Settings > Actions > General approval setting.');
                    continue;
                  }
                }
                await github.rest.issues.addLabels({owner,repo,
                  issue_number:pr.number,labels:['coordinator-approved']});
                core.notice('#'+pr.number+': independently reviewed by bot; coordinator may merge');
              }catch(e){core.warning('#'+pr.number+': failed closed: '+e.message);}
            }
  m1-gate-evidence:
    name: Read-only M1 G1-G8 acceptance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Validate exact-revision evidence using trusted base policy
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            function newest(runs,path,sha,full,events,branch) {
              return runs.filter(r=>r.path===path && r.head_sha===sha && r.head_repository?.full_name===full &&
                events.includes(r.event) && r.head_branch===branch)
                .sort((a,b)=>b.run_number-a.run_number||b.id-a.id)[0];
            }
            
            function verifyJob(jobs,name,steps) {
              const matches=jobs.filter(j=>j.name===name);
              if(matches.length!==1) return false;
              const j=matches[0];
              return j.status==="completed"&&j.conclusion==="success"&&steps.every(step=>
                j.steps?.filter(s=>s.name===step&&s.status==="completed"&&s.conclusion==="success").length===1);
            }
            
            function verifyArtifact(artifacts,name,sha,job,runId) {
              return artifacts.find(a=>a.name===name && a.expired===false && a.size_in_bytes>0 &&
                a.workflow_run?.id===runId && a.workflow_run?.head_sha===sha &&
                Date.parse(a.created_at)>=Date.parse(job?.started_at) &&
                Date.parse(a.created_at)<=Date.parse(job?.completed_at));
            }
            
            // Common evidence includes the exact-revision normal Desktop
            // QEMU job and same-job artifact, not a generic green workflow.
            // Each unresolved later gate has a distinct fail-closed exit.
            const gateHold={
              G6:"Complete full concurrent-writer, per-user and flush-order qualification, plus required physical cache-loss evidence; emulated publication cuts alone are insufficient.",
              G7:"Complete the native independent-process create/read/edit/rename, denied-access and exact same-disk reboot matrix; broker-only paths or host models are insufficient.",
              G8:"Supply exact-revision selected physical-device/firmware and safe shutdown/restart evidence alongside QEMU recovery and negative security tests."
            };
            const gateSteps={
              G2:"Verify G2 retained partition recovery and reboot receipts",
              G3:"Verify G3 retained normal boot and repeated unready recovery receipts",
              G4:"Verify G4 retained ring-3 compositor and recovery evidence",
              G5:"Verify G5 retained live PS/2 input and loss recovery"
            };
            function decideGates(subject, ready, proof) {
              const rows=[];
              const countable=!subject.number && ready;
              for(const [gate,detail] of [
                ["G1","Authenticated Terminal, durable reboot readback and required regressions."],
                ["G2","Defensive MBR/GPT selection, mirror/CRC/identity negatives, ATA write failure, unchanged-media recovery and reboot/remount."],
                ["G3","Normal isolated four-service boot, invalid/unready service/media and shutdown exhaustion, plus two strict unready-compositor boots with retained diagnostics on failure."],
                ["G4","Distinct ring-3 PID1 broker and PID4 compositor, guarded per-app surfaces, full-frame publication, stale authority denied, client-preserving replacement and strict fallback; requires retained exact-revision QEMU and M2 regression evidence."],
                ["G5","Live production PS/2 keyboard and mouse IRQ delivery, focus and capture, independent keyboard overrun and AUX overflow recovery, and visible Files and Terminal responses."]
              ]) {
                const complete=ready && (gate==="G1" || proof[gate]===true && (gate!=="G4" || proof.M2===true));
                rows.push([gate,complete?(countable?"ACCEPTED":"CANDIDATE PASS"):"NOT VERIFIED",detail]);
              }
              for(const [gate,detail] of Object.entries(gateHold))
                rows.push([gate,"BLOCKED",detail]);
              const count=5+rows.filter(row=>row[1]==="ACCEPTED").length;
              const summary=countable
                ? "M1 verified at this revision: "+count+"/13 ("+(count*100/13).toFixed(2)+"%)."
                : "No new M1 acceptance decision for this revision. This is not a rollback of a prior verified milestone.";
              return {rows,summary};
            }

            function selfTest() {
              const assert=require("node:assert/strict");
              const accepted=decideGates({},true,{G2:true,G3:true});
              assert.deepEqual(accepted.rows.filter(r=>r[1]==="ACCEPTED").map(r=>r[0]),["G1","G2","G3"]);
              assert.match(accepted.summary,/8\/13 .*61\.54%/);
              assert.match(decideGates({},true,{G2:true,G3:true,G4:true}).summary,/8\/13 .*61\.54%/);
              const g4ready={G2:true,G3:true,G4:true,M2:true};
              assert.match(decideGates({},true,g4ready).summary,/9\/13 .*69\.23%/);
              const g5ready={...g4ready,G5:true};
              assert.match(decideGates({},true,g5ready).summary,/10\/13 .*76\.92%/);
              for(const [subject,common,proof,expected] of [
                [{},true,{...g4ready,G5:false},"NOT VERIFIED"],
                [{},false,g5ready,"NOT VERIFIED"],
                [{number:1},true,g5ready,"CANDIDATE PASS"]
              ]){
                assert.equal(decideGates(subject,common,proof).rows.find(r=>r[0]==="G5")[1],expected);
              }
              assert.equal(decideGates({},true,{M2:true}).rows.find(r=>r[0]==="G4")[1],"NOT VERIFIED");
              assert.equal(decideGates({number:1},true,g4ready).rows.find(r=>r[0]==="G4")[1],"CANDIDATE PASS");
              assert.equal(decideGates({},false,g4ready).rows.find(r=>r[0]==="G4")[1],"NOT VERIFIED");
              assert.match(decideGates({},true,{}).summary,/6\/13 .*46\.15%/);
              assert.match(decideGates({},true,{G2:true}).summary,/7\/13 .*53\.85%/);
              for(const [passing,blocked] of [["G2","G3"],["G3","G2"]]){
                const decision=decideGates({},true,{[passing]:true,[blocked]:false});
                assert.match(decision.summary,/7\/13 .*53\.85%/);
                assert.equal(decision.rows.find(r=>r[0]===passing)[1],"ACCEPTED");
                assert.equal(decision.rows.find(r=>r[0]===blocked)[1],"NOT VERIFIED");
              }
              for(const [subject,ready] of [[{},false],[{number:1},true],[{number:1},false]]){
                const decision=decideGates(subject,ready,{G2:true,G3:true});
                assert.equal(decision.rows.length,8);
                assert.ok(decision.rows.every(r=>r[1]!=="ACCEPTED"));
                assert.deepEqual(decision.rows.filter(r=>r[1]==="BLOCKED").map(r=>r[0]),["G6","G7","G8"]);
                assert.equal(decision.rows.find(r=>r[0]==="G5")[1],"NOT VERIFIED");
              }
              const sha="a".repeat(40),full="owner/repo",path=".github/workflows/test.yml";
              const run={id:1,run_number:1,path,head_sha:sha,head_branch:"main",head_repository:{full_name:full},event:"push",status:"completed",conclusion:"success"};
              const query=runs=>newest(runs,path,sha,full,["push"],"main");
              assert.equal(query([run]),run);
              assert.equal(query([run,{...run,id:2,run_number:2,conclusion:"failure"}]).conclusion,"failure");
              for(const bad of [{head_sha:"stale"},{event:"pull_request_target"},{head_branch:"other"},{path:"other"},{head_repository:{full_name:"fork/repo"}}])
                assert.equal(query([{...run,...bad}]),undefined);
              const job={name:"desktop",status:"completed",conclusion:"success",steps:[{name:"required",status:"completed",conclusion:"success"}],started_at:"2026-01-01T00:00:00Z",completed_at:"2026-01-01T00:10:00Z"};
              assert.equal(verifyJob([job],"desktop",["required"]),true);
              assert.equal(verifyJob([job,job],"desktop",["required"]),false);
              assert.equal(verifyJob([job],"desktop",["missing"]),false);
              assert.equal(verifyJob([{...job,steps:[{...job.steps[0],conclusion:"skipped"}]}],"desktop",["required"]),false);
              const artifact={name:"normal-"+sha,expired:false,size_in_bytes:10,created_at:"2026-01-01T00:05:00Z",workflow_run:{id:1,head_sha:sha}};
              assert.equal(verifyArtifact([artifact],artifact.name,sha,job,1),artifact);
              for(const bad of [{expired:true},{size_in_bytes:0},{created_at:"2025-12-31T23:59:59Z"},{workflow_run:{id:2,head_sha:sha}},{workflow_run:{id:1,head_sha:"stale"}}])
                assert.equal(verifyArtifact([{...artifact,...bad}],artifact.name,sha,job,1),undefined);
            }
            const specs=[
              [
                ".github/workflows/m1-reliability-integration.yml",
                "Combined reliability",
                [
                  [
                    "combined-regression",
                    [
                      "R118 assert exact integration head checkout",
                      "All host tests with the impacted runtime modules enabled",
                      "Freestanding combined runtime compilation"
                    ]
                  ],
                  [
                    "runtime-qemu",
                    [
                      "R118 assert exact integration head checkout",
                      "Normal profile enters real PID1 and returns safely to recovery",
                      "Real physical input, Terminal persistence and reboot readback",
                      "Read-only boot recovery with damaged init media",
                      "Native descriptor truncate and five-boot durable VFS recovery"
                    ]
                  ],
                  [
                    "normal-desktop-qemu",
                    [
                      "Verify exact source revision",
                      "Normal desktop host, freestanding and harness regression checks",
                      "Build the normal four-service desktop without experimental feature flags",
                      "Actual physical input, selected GPT reboot, compositor and recovery evidence",
                      "Retain real screenshots and serial evidence even on failure"
                    ]
                  ]
                ]
              ],
              [
                ".github/workflows/m1-persistent-desktop.yml",
                "Durable Files",
                [
                  [
                    "durable-files-desktop",
                    [
                      "R118 assert exact integration head checkout",
                      "Real QEMU ring-3 graphical Files plus persistent scratch disk after reboot"
                    ]
                  ]
                ]
              ],
              [
                ".github/workflows/kernel-boot.yml",
                "Full kernel boot",
                [
                  [
                    "Build ELF + ISO and verify serial boot",
                    [
                      "R118 assert exact integration head checkout"
                    ]
                  ]
                ]
              ],
              [
                ".github/workflows/security-gate.yml",
                "Security S0",
                [
                  [
                    "Adversarial FS, signatures and no_std security regression",
                    [
                      "R118 assert exact integration head checkout",
                      "Verify security implementation wiring cannot be bypassed"
                    ]
                  ]
                ]
              ],
              [
                ".github/workflows/roadmap-sha-validation.yml",
                "Roadmap SHA",
                []
              ],
              [
                ".github/workflows/m1-duplicate-prevention.yml",
                "Duplicate prevention",
                []
              ]
            ];
            async function report() {
              selfTest();
              const {owner,repo}=context.repo,full=owner+"/"+repo;
              const getMain=async()=> (await github.rest.repos.getBranch({owner,repo,branch:"main"})).data.commit.sha;
              const main=await getMain();
              const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:"open",base:"main",per_page:100});
              const subjects=[{label:"Current main",sha:main,branch:"main",events:["push","workflow_dispatch"]}];
              for(const pr of prs){
                if(pr.head.repo?.full_name!==full)continue;
                const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:pr.number,per_page:100});
                if(!files.some(f=>/^(docs\/M1_(TASK_REGISTRY|GATES_6_7|GATES_8_10|G1_G8_AUTOMATED_ACCEPTANCE)|rust\/kernel_core\/src\/(m1_|user_runtime|user_image|hier_vfs|fs_handles|durablefs|ata_pio|block)|userland\/rust\/|tools\/test_normal_desktop_qemu\.py|tests\/test_normal_desktop_acceptance\.py)/.test(f.filename)))continue;
                subjects.push({label:"PR #"+pr.number,sha:pr.head.sha,branch:pr.head.ref,events:["pull_request","workflow_dispatch"],number:pr.number});
              }
              await core.summary.addHeading("M1 G1–G8 automated acceptance").addRaw("Each gate requires its own automated evidence on main. PR results are candidates only. Missing required coverage stays blocked; this report does not change GitHub merge rules or edit the milestone ledger.").write();
              for(const s of subjects){
                const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,head_sha:s.sha,per_page:100});
                const rows=[[{data:"Required evidence",header:true},{data:"Result",header:true}]];
                let ready=true;
                const proof={};
                for(const [path,label,requirements] of specs){
                  const r=newest(runs,path,s.sha,full,s.events,s.branch);
                  if(!r){ready=false;rows.push([label,"MISSING exact-revision run"]);continue;}
                  let ok=r.status==="completed"&&r.conclusion==="success";
                  let detail=r.status+"/"+(r.conclusion||"pending");
                  if(ok&&requirements.length){
                    const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:r.id,filter:"latest",per_page:100});
                    const missing=requirements.filter(([n,steps])=>!verifyJob(jobs,n,steps)).map(([n])=>n);
                    if(missing.length){ok=false;detail+="; missing/failed required jobs or steps: "+missing.join(", ");}
                    if(path.endsWith("m1-reliability-integration.yml")&&ok){
                      const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:r.id,per_page:100});
                      const artifact=verifyArtifact(artifacts,"normal-desktop-acceptance-"+s.sha,s.sha,jobs.find(j=>j.name==="normal-desktop-qemu"),r.id);
                      if(!artifact){ok=false;detail+="; missing/expired/stale desktop artifact";}
                      else {
                        detail+="; artifact "+artifact.id;
                        for(const [gate,step] of Object.entries(gateSteps))
                          proof[gate]=verifyJob(jobs,"normal-desktop-qemu",[step]);
                      }
                    }
                  }
                  ready=ready&&ok;
                  rows.push([label,(ok?"PASS: ":"BLOCKED: ")+detail+" (run "+r.id+")"]);
                }
                const m2=newest(runs,".github/workflows/m2-developer-alpha.yml",s.sha,full,s.events,s.branch);
                if(m2?.status==="completed"&&m2.conclusion==="success"){
                  const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:m2.id,filter:"latest",per_page:100});
                  proof.M2=verifyJob(jobs,"m2-native-and-guest",["R118 assert exact integration head checkout",
                    "M2 native SDK package inventory app-store and network tests",
                    "M2 no_std compilation of integrated guest modules",
                    "Verified native ELF signed-install update and rollback in QEMU",
                    "M2 Phase 5C real 32KiB and 64KiB ring3 signed A/B install upgrade rollback in QEMU"]);
                }
                rows.push(["G4 only: M2 non-regression",proof.M2?"PASS (run "+m2.id+")":
                  "NOT VERIFIED"+(m2?" ("+m2.status+"/"+(m2.conclusion||"pending")+", run "+m2.id+")":" (missing exact revision)")]);
                const live=s.number?(await github.rest.pulls.get({owner,repo,pull_number:s.number})).data.head.sha:await getMain();
                if(live!==s.sha){ready=false;rows.push(["Revision stability","BLOCKED: revision changed during review"]);}
                const decision=decideGates(s,ready,proof);
                await core.summary.addHeading(s.label+" — "+s.sha,2).addTable(rows)
                  .addTable([[{data:"Gate",header:true},{data:"Result",header:true},
                    {data:"Evidence or remaining requirement",header:true}],...decision.rows])
                  .addRaw(decision.summary,true).write();
              }
            }
            await report();
