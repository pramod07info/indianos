name: Verify timer and VFS foundations
on:
  push:
    branches: [agentx-verify-timer-vfs-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Test Rust kernel and timer and VFS regressions
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml
      - name: Validate freestanding no_std kernel library
        run: cargo build --offline --manifest-path rust/kernel_core/Cargo.toml --no-default-features --target x86_64-unknown-none
      - name: Enforce source ownership and agent safety checks
        run: |
          python3 -m unittest discover -s tests -p 'test_agent_x_autodev.py' -v
          make test-rust-source-audit
