name: IndianOS Unified - Ten Modules One Build

on:
  # Run one integrated verification after the full main-branch kernel CI.
  workflow_run:
    workflows: ["IndianOS kernel boot (x86-64)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One build for all ten modules, never ten independent unvalidated branches.
concurrency:
  group: indianos-unified-ten-modules
  cancel-in-progress: false

jobs:
  verify-consolidated:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install kernel linker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang lld binutils
          command -v ld
      - name: Verify all ten assigned modules are implemented
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from agent_swarm import AGENTS
          assert len(AGENTS) == 10
          for agent, task in sorted(AGENTS.items()):
              module = task['module']
              path = Path('rust/kernel_core/src') / (module + '.rs')
              source = path.read_text(encoding='utf-8')
              assert 'SWARM EMPTY SLOT' not in source, module
              assert '#[cfg(test)]' in source, module
              assert source.count('#[test]') >= 3, module
              assert 'pub fn ' in source, module
              print(f'Agent {agent}: {module} implemented and tested')
          PY
      - name: One host test pass for all ten kernel modules
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml
      - name: One freestanding Rust build with all ten modules
        run: cargo build --offline --manifest-path rust/kernel_core/Cargo.toml --no-default-features --target x86_64-unknown-none
      - name: Audit Rust kernel source
        run: make test-rust-source-audit
      - name: One consolidated kernel ELF link
        run: make kernel BUILD=build/unified-ten RUST_CORE=1
      - name: Confirm verification did not modify source
        run: git diff --exit-code
