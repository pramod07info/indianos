name: R114 actual QEMU boot epoch persistence
on:
  pull_request:
    branches: [main]
    paths:
      - "rust/kernel_core/src/r114_boot_epoch.rs"
      - "rust/kernel_core/src/kernel_main.rs"
      - "tools/test_r114_epoch_qemu.py"
      - "Makefile"
      - ".github/workflows/r114-epoch-qemu.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install isolated OVMF and emulator
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - name: Rust epoch host tests
        run: cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --lib r114_boot_epoch
      - name: Three actual OVMF cold boots and corrupt-journal negative control
        shell: bash
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-r114-epoch-qemu OVMF_CODE="$OVMF_PATH"
