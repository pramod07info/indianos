name: M1 persistent desktop and durable VFS integration
on:
  push:
    branches: [main, milestone/m1-desktop-storage]
    paths:
      - 'rust/kernel_core/src/m1_*.rs'
      - 'rust/kernel_core/src/block.rs'
      - 'rust/kernel_core/src/durablefs.rs'
      - 'rust/kernel_core/src/hier_vfs.rs'
      - 'rust/kernel_core/src/lib.rs'
      - 'rust/kernel_core/Cargo.toml'
      - '.github/workflows/m1-persistent-desktop.yml'
  pull_request:
    paths:
      - 'rust/kernel_core/src/m1_*.rs'
      - 'rust/kernel_core/src/block.rs'
      - 'rust/kernel_core/src/durablefs.rs'
      - 'rust/kernel_core/src/hier_vfs.rs'
      - 'rust/kernel_core/src/lib.rs'
      - 'rust/kernel_core/Cargo.toml'
      - '.github/workflows/m1-persistent-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-files-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute M1 MBR/GPT partition parser, remount and Terminal tests
        run: |
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs m1_
          # R040: fail CI if the new security, desktop routing or input
          # history tests fail; the legacy m1_ filter alone would skip them.
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs r040_
          # R043: run substantial Terminal, source editor and Desktop integration
          # regression cases rather than silently skipping them with m1_ only.
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs r043_
          # Keep R041/R042 keyboard and R044 live-caret/clipboard/history
          # regressions in the mandatory M1 gate. Do not hide failures.
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs r041_
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs r042_
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs r044_
          # R045 mandatory read-only MBR/GPT inventory, geometry-locked mount,
          # redundant COW health and crash/corruption regression tests.
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs r045_
          # R046: enforce exact failed-write/recovery, strict mounts,
          # authenticated Desktop repair and real VFS remount regressions.
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs m1_r046_
      - name: Build M1 durable VFS service interfaces in no_std mode
        run: |
          cargo check --offline --manifest-path rust/kernel_core/Cargo.toml --no-default-features --features test-r031-vfs
      - name: Install emulator and UEFI dependencies for real graphical Files disk test
        run: |
          # Github-hosted mirrors can download QEMU slowly. Preserve the
          # mandatory emulator test; avoid optional GUI packages and retry.
          sudo timeout 300s apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=40
          sudo timeout 600s apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=40 clang lld binutils xorriso qemu-system-x86 ovmf curl openssl
      - name: Install freestanding target for guest verification
        run: rustup target add x86_64-unknown-none
      - name: Real QEMU ring-3 graphical Files plus persistent scratch disk after reboot
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for path in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$path"; then OVMF_PATH="$path"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-r031-files-gui-qemu OVMF_CODE="$OVMF_PATH"
