name: IndianOS Orbit R001 - real QEMU desktop preview
on:
  push:
    branches: [feature/orbit-ui-r001-qemu-preview]
  pull_request:
    paths:
      - 'rust/kernel_core/src/orbit_ui.rs'
      - 'rust/kernel_core/src/gui.rs'
      - 'rust/kernel_core/src/lib.rs'
      - 'rust/kernel_core/Cargo.toml'
      - 'Makefile'
      - '.github/workflows/orbit-ui-qemu-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orbit-ui-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF and freestanding compiler
        run: |
          sudo timeout 300s apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=40
          sudo timeout 600s apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=40 clang lld binutils xorriso qemu-system-x86 ovmf curl openssl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Test Orbit workspace shortcuts and kernel UI ownership
        run: |
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --features orbit-ui-preview
          make test-rust-host-abi
      - name: Boot actual Orbit GUI and verify ring-3 Files and Terminal redraw
        env:
          R029_USER_SCREENSHOT_DIR: build/orbit-ui-screenshots
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-orbit-ui-qemu OVMF_CODE="$OVMF_PATH"
          printf 'Orbit R001 real VGA, commit %s\n' "$GITHUB_SHA" > build/orbit-ui-screenshots/SOURCE_COMMIT.txt
      - name: Save real QEMU framebuffer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-orbit-r001-real-qemu-screenshots
          path: build/orbit-ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
