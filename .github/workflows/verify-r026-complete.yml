name: Verify R026 persistent shell and on-demand user services
on:
  push:
    branches: [agentx-r026-complete-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r026:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and bare-metal build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Test kernel process and syscall contracts
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r026
      - name: Test Rust native shell command parser
        run: |
          rustc --edition 2021 --test userland/rust/tests/shell_commands.rs -o /tmp/indianos-r026-shell-tests
          /tmp/indianos-r026-shell-tests
      - name: Check freestanding R026 kernel
        run: cargo build --offline --manifest-path rust/kernel_core/Cargo.toml --target x86_64-unknown-none --no-default-features --features cpu-entry,vmm,pmm,user-image,paging,paging-cpu,user-runtime,runtime,boot-staging,boot,interrupts,timer,kernel-main,limine-requests,test-r026
      - name: Enforce Rust-only live kernel
        run: make test-rust-source-audit
      - name: QEMU persistent interactive shell and worker life cycle
        shell: bash
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-r026-interactive-qemu OVMF_CODE="$OVMF_PATH"
