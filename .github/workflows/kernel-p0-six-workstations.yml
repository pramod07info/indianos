name: Kernel P0 - six independent validation workstations
on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/kernel_core/src/**'
      - '.github/workflows/kernel-p0-six-workstations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-kernel-workstations:
    name: ${{ matrix.workstation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - workstation: W1-SMP-retirement
            filter: kernel_p0_w1
            features: normal-desktop
          - workstation: W2-scheduler-fairness
            filter: kernel_p0_w2
            features: normal-desktop
          - workstation: W3-authenticated-IPC
            filter: kernel_p0_w3
            features: normal-desktop
          - workstation: W4-durable-VFS
            filter: kernel_p0_w4
            features: test-r031-vfs
          - workstation: W5-NIC-quiescence
            filter: kernel_p0_w5
            features: normal-desktop
          - workstation: W6-boot-handoff
            filter: kernel_p0_w6
            features: normal-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/verify_ci_sha.py --expected "$EXPECTED_SHA" --observed "$(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Compile and run actual workstation regression tests
        env:
          FILTER: ${{ matrix.filter }}
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --lib --features "$FEATURES" "$FILTER" -- --list | grep -F "$FILTER"
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --lib --features "$FEATURES" "$FILTER"
      - name: Compile freestanding no_std kernel profile
        env:
          FEATURES: ${{ matrix.features }}
        run: >-
          cargo check --locked --offline --manifest-path rust/kernel_core/Cargo.toml
          --no-default-features --target x86_64-unknown-none --features "$FEATURES"
