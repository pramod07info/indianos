name: Verify R028 virtio networking in QEMU
on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/kernel_core/src/network.rs'
      - 'rust/kernel_core/src/agent_06_ipv4_route.rs'
      - 'rust/kernel_core/src/virtio_net.rs'
      - 'rust/kernel_core/src/nic_interrupt.rs'
      - 'rust/kernel_core/src/arch/x86_64/nic_entry.S'
      - 'rust/kernel_core/src/cpu_entry.rs'
      - 'rust/kernel_core/src/interrupts.rs'
      - 'rust/kernel_core/src/timer.rs'
      - 'rust/kernel_core/Cargo.toml'
      - 'Makefile'
      - 'tests/test_nic_irq_acceptance.py'
      - 'tools/test_r028_network_qemu.py'
      - '.github/workflows/verify-r028-network.yml'
  push:
    branches: [agentx-r028-complete-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: R118 assert exact integration head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/verify_ci_sha.py --expected "$EXPECTED_SHA" --observed "$(git rev-parse HEAD)"
      - name: Install x86-64 emulator and kernel toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Unit tests for Ethernet IPv4 checksum and protocol bounds
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml
      - name: R125 validate bounded Limine multi-CPU wire protocol
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features limine-requests r125_
      - name: Compile network-enabled freestanding kernel
        run: cargo build --offline --manifest-path rust/kernel_core/Cargo.toml --target x86_64-unknown-none --no-default-features --features cpu-entry,vmm,pmm,user-image,paging,paging-cpu,user-runtime,runtime,boot-staging,boot,interrupts,timer,kernel-main,limine-requests,test-r028-network
      - name: Rust kernel ownership and security audit
        run: make test-rust-source-audit
      - name: Real QEMU virtio-net ARP ping UDP DNS TCP client
        shell: bash
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-r028-network-qemu OVMF_CODE="$OVMF_PATH"
      - name: Exclusive NIC IRQ admission and actual queue notifications with safe DMA retirement
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r136-nic-irq nic_interrupt
          python3 -m unittest discover -s tests -p test_nic_irq_acceptance.py -v
          make image BUILD=build/r136-nic-irq RUST_CORE=1 R028_NETWORK_TEST=1 R136_NIC_IRQ_TEST=1
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          python3 tools/test_r028_network_qemu.py --iso build/r136-nic-irq/indianos.iso \
            --qemu qemu-system-x86_64 --ovmf "$OVMF_PATH" --require-nic-irq \
            --serial-log build/r136-nic-irq/irq.serial.log
      - name: Retain actual NIC IRQ and DMA reset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r136-nic-irq-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/r136-nic-irq/irq.serial.log
          if-no-files-found: error
          retention-days: 14
