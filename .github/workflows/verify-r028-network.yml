name: Verify R028 virtio networking in QEMU
on:
  push:
    branches: [agentx-r028-complete-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install x86-64 emulator and kernel toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Unit tests for Ethernet IPv4 checksum and protocol bounds
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml
      - name: Compile network-enabled freestanding kernel
        run: cargo build --offline --manifest-path rust/kernel_core/Cargo.toml --target x86_64-unknown-none --no-default-features --features cpu-entry,vmm,pmm,user-image,paging,paging-cpu,user-runtime,runtime,boot-staging,boot,interrupts,timer,kernel-main,limine-requests,test-r028-network
      - name: Rust kernel ownership and security audit
        run: make test-rust-source-audit
      - name: Real QEMU virtio-net ARP ping UDP DNS TCP client
        shell: bash
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-r028-network-qemu OVMF_CODE="$OVMF_PATH"
