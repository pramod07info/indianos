name: Verify R025 complete syscall services QEMU
on:
  push:
    branches: [agentx-r025-complete-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r025:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Rust kernel capabilities filesystem and syscall unit regressions
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r025
      - name: Freestanding QEMU test-mode kernel compilation
        run: cargo build --offline --manifest-path rust/kernel_core/Cargo.toml --target x86_64-unknown-none --no-default-features --features cpu-entry,vmm,pmm,user-image,paging,paging-cpu,user-runtime,runtime,boot-staging,boot,interrupts,timer,kernel-main,limine-requests,test-scheduler,test-r025
      - name: Rust code ownership and syscall safety
        run: make test-rust-source-audit
      - name: Original R025 IPC QEMU regression
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-ipc-qemu OVMF_CODE="$OVMF_PATH"
      - name: Full R025 ring-3 capabilities IPC file syscalls process cleanup
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-r025-complete-qemu OVMF_CODE="$OVMF_PATH"
