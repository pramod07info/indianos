name: IndianOS kernel boot (x86-64)

on:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "rust/**"
      - "boot/**"
      - "third_party/limine/**"
      - "Makefile"
      - "tools/rust/**"
      - "tools/smoke_boot.py"
      # All QEMU Python acceptance tests and regression tests must trigger
      # the full kernel build when their assertions or inputs change.
      - "tools/test_*.py"
      - "tests/test_*.py"
      - "tests/test_smoke_boot.py"
      - "tests/test_pmm.c"
      - "tests/test_vmm.c"
      - "tests/test_paging.c"
      - "tests/test_program.c"
      - "tests/test_user_image.c"
      - "tests/test_user_fault.c"
      - "tests/test_process.c"
      - "tests/test_scheduler.c"
      - "kernel/include/indianos/scheduler.h"
      - "userland/demo/scheduler_a.S"
      - "userland/demo/scheduler_b.S"
      - "userland/demo/preempt_a.S"
      - "userland/demo/preempt_b.S"
      - "kernel/arch/x86_64/timer.c"
      - "kernel/include/indianos/process.h"
      - "userland/demo/worker_entry.S"
      - "kernel/include/indianos/user_fault.h"
      - "userland/demo/fault_entry.S"
      - "tests/inspect_archive.c"
      - "tests/test_initramfs_tool.py"
      - "tools/build_initramfs.py"
      - "tools/check_usermode_fixture.py"
      - "tests/test_usermode_fixture.py"
      - "tests/inspect_elf.c"
      - "userland/**"
      - ".github/workflows/kernel-boot.yml"
      - ".github/workflows/agent-x-local-model.yml"
      - ".github/workflows/agent-ci-handoff.yml"
      - "tools/agent_x_ci_context.py"
      - ".github/workflows/agent-swarm.yml"
      - ".github/workflows/agent-swarm-checks.yml"
      - "tools/agent_swarm.py"
      - "tests/test_agent_swarm.py"
      - ".github/workflows/agent-x-autodev.yml"
      - "tools/agent_x_autodev.py"
      - "tests/test_agent_x_autodev.py"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_shadow_switch:
        description: "Run experimental QEMU-only CR3 switch smoke test"
        required: false
        default: false
        type: boolean
      run_usermode:
        description: "Run experimental ring-3 /bin/init QEMU syscall smoke test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write  # report QEMU ring-3 result for direct-to-main commits

jobs:
  qemu-uefi:
    name: Build ELF + ISO and verify serial boot
    runs-on: ubuntu-latest
    # Full Rust migration + R024-R029 QEMU checks exceeded the previous
    # 30-minute job limit on 2026-10-23 (run 39942078879), despite all
    # mandatory test steps passing. Allow the complete suite to finish.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install emulator and image-building dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - name: Install Rust toolchain for no_std kernel build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: R020 mandatory Rust IPC and Agent X policy regressions
        run: |
          cargo test --manifest-path rust/kernel_core/Cargo.toml --offline
          python3 -m unittest discover -s tests -p "test_agent_x_autodev.py" -v
      - name: Issue 124 HD0 installer and boot hardware profile regressions
        run: |
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml hd0_
      - name: Issue 124 HD1 bridge and PCIe MCFG host tests
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml hd1_
          python3 -m unittest discover -s tests -p "test_smoke_boot.py" -v
      - name: Issue 124 HD2 signed driver catalog and default-deny matching
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml hd2_
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --features test-m2-developer-alpha hd2_
      - name: Issue 124 HD3 signed image staging and resource isolation
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml hd3_
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --features test-m2-developer-alpha hd3_
      - name: Issue 124 HD3B.1 virtio-gpu PCI and 2D command validation
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml hd3b_
      - name: S0 mandatory filesystem malware containment regressions
        run: |
          set -euo pipefail
          python3 tools/test_security_contract.py
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml security_
          cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --features test-r031-vfs security_
      - name: Check cross compiler
        run: make toolchain-check
      - name: Enforce Rust-owned default kernel source audit
        run: make test-rust-source-audit
      - name: Rust unit tests and original C ABI regression (migration R001)
        id: rust_host
        continue-on-error: true
        run: |
          set -o pipefail
          make test-rust-host-abi 2>&1 | tee build-rust-host.log
      - name: Compile Rust-backed kernel ELF (migration R001)
        id: rust_kernel
        continue-on-error: true
        run: |
          set -o pipefail
          make kernel BUILD=build/rust-compile RUST_CORE=1 2>&1 | tee build-rust-kernel.log
      - name: R010 enforce real ELF link provenance and negative controls
        run: |
          make test-rust-source-audit-negative
          make test-rust-link-audit BUILD=build/rust-compile
      - name: R011 enforce CPU ABI and C/assembly fallback
        run: |
          make test-rust-entry-abi BUILD=build/rust-compile
          make kernel BUILD=build/r011-c-reference RUST_CORE=0
      - name: R012 adversarial syscall, VMM permission and user-copy tests
        run: make test-rust-hardening
      - name: R013 shell parser and restricted kernel syscall tests
        run: make test-rust-shell-host
      - name: R013 scripted init shell and worker lifecycle in QEMU
        run: |
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-shell-qemu OVMF_CODE="$OVMF_PATH"
      - name: R014 console driver and writable user-buffer tests
        run: make test-rust-interactive-host
      - name: R014 interactive console QEMU regression
        run: |
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-interactive-qemu OVMF_CODE="$OVMF_PATH"
      - name: R015 ATA PIO disposable QEMU disk validation
        run: |
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-ata-qemu OVMF_CODE="$OVMF_PATH"
      - name: R014.2 PS/2 IRQ and framebuffer console host tests
        run: make test-rust-keyboard-host
      - name: R014.2 physical PS/2 keyboard in QEMU
        run: |
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-keyboard-qemu OVMF_CODE="$OVMF_PATH"
      - name: Rust VMM original C ABI tests (candidate)
        id: rust_vmm_host
        continue-on-error: true
        run: |
          set -o pipefail
          make test-rust-vmm-host 2>&1 | tee build-rust-vmm-host.log
      - name: Rust VMM two-process and scheduler QEMU parity (candidate)
        id: rust_vmm_qemu
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-vmm-qemu OVMF_CODE="$OVMF_PATH" 2>&1 | tee build-rust-vmm-qemu.log
      - name: Publish Rust VMM parity status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VMM_HOST: ${{ steps.rust_vmm_host.outcome }}
          VMM_QEMU: ${{ steps.rust_vmm_qemu.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          h, q = os.getenv("VMM_HOST", "skipped"), os.getenv("VMM_QEMU", "skipped")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": "success" if h == "success" and q == "success" else "failure",
              "context": "indianos/rust-vmm-qemu",
              "description": f"Rust VMM: original C tests={h}, user processes and scheduler QEMU={q}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                            data=payload, method="POST",
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json",
                                     "Content-Type": "application/json"})
          with urlopen(request, timeout=20) as response:
              print("Rust VMM results:", h, q, response.status)
          PY
      - name: Upload Rust VMM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-rust-vmm-parity
          path: |
            build-rust-vmm-host.log
            build-rust-vmm-qemu.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust PMM original C ABI tests (candidate)
        id: rust_pmm_host
        continue-on-error: true
        run: |
          set -o pipefail
          make test-rust-pmm-host 2>&1 | tee build-rust-pmm-host.log
      - name: Rust PMM process/scheduler QEMU parity (candidate)
        id: rust_pmm_qemu
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-pmm-qemu OVMF_CODE="$OVMF_PATH" 2>&1 | tee build-rust-pmm-qemu.log
      - name: Publish Rust PMM parity status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PMM_HOST: ${{ steps.rust_pmm_host.outcome }}
          PMM_QEMU: ${{ steps.rust_pmm_qemu.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          h, q = os.getenv("PMM_HOST", "skipped"), os.getenv("PMM_QEMU", "skipped")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": "success" if h == "success" and q == "success" else "failure",
              "context": "indianos/rust-pmm-qemu",
              "description": f"Rust PMM: original C tests={h}, user processes and scheduler QEMU={q}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                            data=payload, method="POST",
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json",
                                     "Content-Type": "application/json"})
          with urlopen(request, timeout=20) as response:
              print("Rust PMM results:", h, q, response.status)
          PY
      - name: Upload Rust PMM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-rust-pmm-parity
          path: |
            build-rust-pmm-host.log
            build-rust-pmm-qemu.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust user-image staging and copy C ABI tests (candidate)
        id: rust_image_host
        continue-on-error: true
        run: |
          set -o pipefail
          make test-rust-user-image-host 2>&1 | tee build-rust-image-host.log
      - name: Rust user-image QEMU two-process and scheduler parity (candidate)
        id: rust_image_qemu
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-user-image-qemu OVMF_CODE="$OVMF_PATH" 2>&1 | tee build-rust-image-qemu.log
      - name: Publish Rust user-image parity status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_HOST: ${{ steps.rust_image_host.outcome }}
          IMAGE_QEMU: ${{ steps.rust_image_qemu.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          h, q = os.getenv("IMAGE_HOST", "skipped"), os.getenv("IMAGE_QEMU", "skipped")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": "success" if h == "success" and q == "success" else "failure",
              "context": "indianos/rust-user-image-qemu",
              "description": f"Rust ELF image staging/copy C ABI={h}; two user processes QEMU={q}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                            data=payload, method="POST",
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json",
                                     "Content-Type": "application/json"})
          with urlopen(request, timeout=20) as response:
              print("Rust user-image results:", h, q, response.status)
          PY
      - name: Upload Rust user-image diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-rust-user-image-parity
          path: |
            build-rust-image-host.log
            build-rust-image-qemu.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust paging clone and CPU policy original C ABI tests (candidate)
        id: rust_paging_host
        continue-on-error: true
        run: |
          set -o pipefail
          make test-rust-paging-host 2>&1 | tee build-rust-paging-host.log
      - name: Rust paging clone QEMU process and fault isolation (candidate)
        id: rust_paging_qemu
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-paging-qemu OVMF_CODE="$OVMF_PATH" 2>&1 | tee build-rust-paging-qemu.log
      - name: Publish Rust paging clone parity status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGING_HOST: ${{ steps.rust_paging_host.outcome }}
          PAGING_QEMU: ${{ steps.rust_paging_qemu.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          h, q = os.getenv("PAGING_HOST", "skipped"), os.getenv("PAGING_QEMU", "skipped")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": "success" if h == "success" and q == "success" else "failure",
              "context": "indianos/rust-paging-qemu",
              "description": f"Rust paging clone and preflight C ABI={h}; QEMU user/fault={q}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                            data=payload, method="POST",
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json",
                                     "Content-Type": "application/json"})
          with urlopen(request, timeout=20) as response:
              print("Rust paging results:", h, q, response.status)
          PY
      - name: Upload Rust paging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-rust-paging-parity
          path: |
            build-rust-paging-host.log
            build-rust-paging-qemu.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust UART and memory runtime C ABI tests (candidate)
        id: rust_runtime_host
        continue-on-error: true
        run: |
          set -o pipefail
          make test-rust-runtime-host 2>&1 | tee build-rust-runtime-host.log
      - name: Rust UART/memory runtime QEMU boot parity (candidate)
        id: rust_runtime_qemu
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-runtime-qemu OVMF_CODE="$OVMF_PATH" 2>&1 | tee build-rust-runtime-qemu.log
      - name: Publish Rust runtime QEMU parity status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_HOST: ${{ steps.rust_runtime_host.outcome }}
