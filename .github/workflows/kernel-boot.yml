        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-rust-boot-staging
          path: build-rust-boot-staging.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust Limine boot and framebuffer QEMU parity (candidate)
        id: rust_boot_qemu
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
