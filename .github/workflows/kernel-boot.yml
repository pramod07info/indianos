        run: |
          readelf -h build/indianos.elf
          readelf -l build/indianos.elf
          readelf -h build/indianos.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          # Static relocation means the Limine-loaded kernel needs no dynamic loader.
          readelf -r build/indianos.elf | grep -q "There are no relocations"
