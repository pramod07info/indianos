name: IndianOS kernel boot (x86-64)

on:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "rust/**"
      - "boot/**"
      - "third_party/limine/**"
      - "Makefile"
      - "tools/smoke_boot.py"
      - "tests/test_smoke_boot.py"
      - "tests/test_pmm.c"
      - "tests/test_vmm.c"
      - "tests/test_paging.c"
      - "tests/test_program.c"
      - "tests/test_user_image.c"
      - "tests/test_user_fault.c"
      - "tests/test_process.c"
      - "tests/test_scheduler.c"
      - "kernel/include/indianos/scheduler.h"
      - "userland/demo/scheduler_a.S"
      - "userland/demo/scheduler_b.S"
      - "userland/demo/preempt_a.S"
      - "userland/demo/preempt_b.S"
      - "kernel/arch/x86_64/timer.c"
      - "kernel/include/indianos/process.h"
      - "userland/demo/worker_entry.S"
      - "kernel/include/indianos/user_fault.h"
      - "userland/demo/fault_entry.S"
      - "tests/inspect_archive.c"
      - "tests/test_initramfs_tool.py"
      - "tools/build_initramfs.py"
      - "tools/check_usermode_fixture.py"
      - "tests/test_usermode_fixture.py"
      - "tests/inspect_elf.c"
      - "userland/**"
      - ".github/workflows/kernel-boot.yml"
  workflow_dispatch:
    inputs:
      run_shadow_switch:
        description: "Run experimental QEMU-only CR3 switch smoke test"
        required: false
        default: false
        type: boolean
      run_usermode:
        description: "Run experimental ring-3 /bin/init QEMU syscall smoke test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write  # report QEMU ring-3 result for direct-to-main commits

jobs:
  qemu-uefi:
    name: Build ELF + ISO and verify serial boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install emulator and image-building dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - name: Install Rust toolchain for no_std kernel build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Check cross compiler
        run: make toolchain-check
      - name: Rust unit tests and original C ABI regression (migration R001)
        id: rust_host
        continue-on-error: true
        run: |
          set -o pipefail
          make test-rust-host-abi 2>&1 | tee build-rust-host.log
      - name: Compile Rust-backed kernel ELF (migration R001)
        id: rust_kernel
        continue-on-error: true
        run: |
          set -o pipefail
          make kernel BUILD=build/rust-compile RUST_CORE=1 2>&1 | tee build-rust-kernel.log
      - name: Host tests (PMM, VMM, ELF64 image and serial transcript parser)
        run: make test-host
      - name: Sanitize M005 executable planning and syscall ABI
        run: |
          clang -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -I kernel/include \
            tests/test_program.c kernel/src/program.c kernel/src/syscall_abi.c \
            -o build/m005_program_sanitized
          ./build/m005_program_sanitized
      - name: Compile and inspect freestanding user ELF fixture
        run: make test-user-elf
      - name: Build and verify packaged read-only initramfs
        run: make test-initramfs
      - name: Sanitize physical user-image staging and initramfs parser
        run: |
          clang -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -I kernel/include \
            tests/test_user_image.c kernel/src/program.c kernel/src/initramfs.c \
            kernel/src/user_image.c kernel/src/user_copy.c kernel/src/vmm.c -o build/user_image_sanitized
          ./build/user_image_sanitized
      - name: Sanitize kernel-only page-table clone and attachment logic
        run: |
          clang -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -I kernel/include \
            tests/test_paging.c kernel/src/paging_clone.c kernel/src/paging_policy.c \
            -o build/paging_user_sanitized
          ./build/paging_user_sanitized
      - name: Build and verify syscall-enabled ring-3 ELF fixture
        run: make test-ring3-elf
      - name: Compile freestanding kernel and package ISO
        run: make image
      - name: Inspect x86-64 ELF load segments
        run: |
          readelf -h build/indianos.elf
          readelf -l build/indianos.elf
          readelf -h build/indianos.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
      - name: Experimental ring-3 syscall execution (non-blocking; QEMU)
        id: ring3_test
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          # Prefer unsigned, non-Secure-Boot OVMF and avoid find|head SIGPIPE under pipefail.
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-usermode OVMF_CODE="$OVMF_PATH" 2>&1 | tee build/ring3-smoke.log
      - name: Publish exact ring-3 QEMU commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RING3_STEP: ${{ steps.ring3_test.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          outcome = os.environ.get("RING3_STEP", "skipped")
          state = "success" if outcome == "success" else ("failure" if outcome == "failure" else "error")
          tail = ""
          path = Path("build/ring3-smoke.log")
          if path.is_file():
              for line in reversed(path.read_text(errors="replace").splitlines()):
                  if "IndianOS:" in line or "QEMU smoke test" in line:
                      tail = line.strip()
                      break
          description = (f"QEMU ring-3: {outcome}" + (f"; {tail}" if tail else ""))[:140]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
                     f"{os.environ['GITHUB_RUN_ID']}")
          payload = json.dumps({
              "state": state, "context": "indianos/ring3-qemu",
              "description": description, "target_url": run_url,
          }).encode()
          req = Request(f"https://api.github.com/repos/{repo}/statuses/{sha}",
                        data=payload, method="POST",
                        headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                 "Accept": "application/vnd.github+json",
                                 "X-GitHub-Api-Version": "2022-11-28",
                                 "Content-Type": "application/json"})
          with urlopen(req, timeout=20) as result:
              print(f"Published ring-3 commit status: {state} (HTTP {result.status})")
          PY
      - name: M008 sequential process execution (required QEMU)
        id: process_test
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-processes OVMF_CODE="$OVMF_PATH" 2>&1 | tee build/processes-smoke.log
      - name: Publish M008 process lifecycle CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROCESS_OUTCOME: ${{ steps.process_test.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          outcome = os.environ.get("PROCESS_OUTCOME", "skipped")
          state = "success" if outcome == "success" else ("failure" if outcome == "failure" else "error")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": state, "context": "indianos/processes-qemu",
              "description": f"Two sequential user processes and PMM reclamation: {outcome}",
              "target_url": (f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
                             f"{os.environ['GITHUB_RUN_ID']}")
          }).encode()
          req = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                        data=payload, method="POST",
                        headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                 "Accept": "application/vnd.github+json",
                                 "Content-Type": "application/json"})
          with urlopen(req, timeout=20) as response:
              print(f"Published M008 process CI status: {state} (HTTP {response.status})")
          PY
      - name: Upload M008 QEMU process transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-m008-processes-qemu-log
          path: build/processes-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust-backed PCB/scheduler kernel QEMU parity tests
        id: rust_qemu
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-processes OVMF_CODE="$OVMF_PATH" 2>&1 | tee build/rust-processes-smoke.log
          make test-rust-scheduler OVMF_CODE="$OVMF_PATH" 2>&1 | tee build/rust-scheduler-smoke.log
      - name: Publish exact Rust migration CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_HOST: ${{ steps.rust_host.outcome }}
          RUST_KERNEL: ${{ steps.rust_kernel.outcome }}
          RUST_QEMU: ${{ steps.rust_qemu.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          host = os.environ.get("RUST_HOST", "skipped")
          kernel = os.environ.get("RUST_KERNEL", "skipped")
          qemu = os.environ.get("RUST_QEMU", "skipped")
          state = "success" if host == kernel == qemu == "success" else "failure"
          repo = os.environ["GITHUB_REPOSITORY"]
          message = f"no_std Rust core: host={host}, kernel={kernel}, QEMU={qemu}"
          payload = json.dumps({
              "state": state, "context": "indianos/rust-core-qemu",
              "description": message[:140],
              "target_url": (f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
                             f"{os.environ['GITHUB_RUN_ID']}")
          }).encode()
          req = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                        data=payload, method="POST",
                        headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                 "Accept": "application/vnd.github+json",
                                 "Content-Type": "application/json"})
          with urlopen(req, timeout=20) as response:
              print(message, state, response.status)
          PY
      - name: Preserve Rust compilation and QEMU transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-rust-core-migration-logs
          path: |
            build-rust-host.log
            build-rust-kernel.log
            build/rust-processes-smoke.log
            build/rust-scheduler-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: M009 cooperative round-robin QEMU test (experimental)
        id: scheduler_test
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-scheduler OVMF_CODE="$OVMF_PATH" 2>&1 | tee build/scheduler-smoke.log
      - name: Publish M009 scheduler CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          M009_OUTCOME: ${{ steps.scheduler_test.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          outcome = os.getenv("M009_OUTCOME", "skipped")
          state = "success" if outcome == "success" else ("failure" if outcome == "failure" else "error")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": state, "context": "indianos/scheduler-qemu",
              "description": f"Cooperative two-context round-robin QEMU: {outcome}",
              "target_url": (f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
                             f"{os.environ['GITHUB_RUN_ID']}")
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                            data=payload, method="POST",
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json",
                                     "Content-Type": "application/json"})
          with urlopen(request, timeout=20) as response:
              print(f"M009 scheduler status: {state} ({response.status})")
          PY
      - name: Upload M009 QEMU scheduler transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-m009-scheduler-qemu-log
          path: build/scheduler-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: M009 PIT IRQ0 preemptive context switching (experimental QEMU)
        id: preempt_test
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-preempt OVMF_CODE="$OVMF_PATH" 2>&1 | tee build/preempt-smoke.log
      - name: Publish M009 PIT preemption CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREEMPT_OUTCOME: ${{ steps.preempt_test.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          outcome = os.getenv("PREEMPT_OUTCOME", "skipped")
          state = "success" if outcome == "success" else ("failure" if outcome == "failure" else "error")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": state, "context": "indianos/preempt-qemu",
              "description": f"Hardware PIT IRQ0 preemption: {outcome}",
              "target_url": (f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
                             f"{os.environ['GITHUB_RUN_ID']}")
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
                            data=payload, method="POST",
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json",
                                     "Content-Type": "application/json"})
          with urlopen(request, timeout=20) as response:
              print(f"M009 PIT preemption status: {state} ({response.status})")
          PY
      - name: Upload M009 hardware preemption QEMU transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-m009-preempt-qemu-log
          path: build/preempt-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: QEMU user fault isolation (guard + supervisor)
        id: userfault_test
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-userfault-supervisor OVMF_CODE="$OVMF_PATH" 2>&1 | tee build/fault-containment.log
          make test-userfault-guard OVMF_CODE="$OVMF_PATH" 2>&1 | tee -a build/fault-containment.log
      - name: Publish user fault containment CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          USERFAULT_OUTCOME: ${{ steps.userfault_test.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          outcome = os.getenv("USERFAULT_OUTCOME", "skipped")
          state = "success" if outcome == "success" else ("failure" if outcome == "failure" else "error")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": state,
              "context": "indianos/userfault-qemu",
              "description": f"QEMU ring-3 guard+supervisor fault tests: {outcome}",
              "target_url": (f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
                             f"{os.environ['GITHUB_RUN_ID']}"),
          }).encode()
          request = Request(
              f"https://api.github.com/repos/{repo}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
          )
          with urlopen(request, timeout=20) as response:
              print("User fault status:", state, response.status)
          PY
      - name: Upload user-fault QEMU transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-userfault-qemu-log
          path: build/fault-containment.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload ring-3 smoke transcript for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-ring3-experimental-log
          path: build/ring3-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Boot IndianOS in QEMU/OVMF
        run: |
          OVMF_PATH=""
          # Prefer unsigned, non-Secure-Boot OVMF and avoid find|head SIGPIPE under pipefail.
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-boot OVMF_CODE="$OVMF_PATH"
      - name: Upload experimental ISO for emulator debugging
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: indianos-experimental-qemu-only
          path: build/indianos.iso
          retention-days: 7
      - name: Verify an intentional invalid opcode reaches our IDT
        run: |
          OVMF_PATH=""
          # Prefer unsigned, non-Secure-Boot OVMF and avoid find|head SIGPIPE under pipefail.
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-exception OVMF_CODE="$OVMF_PATH"
      - name: Verify page-fault address via CR2 in a separate test image
        run: |
          OVMF_PATH=""
          # Prefer unsigned, non-Secure-Boot OVMF and avoid find|head SIGPIPE under pipefail.
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-pagefault OVMF_CODE="$OVMF_PATH"
      - name: Opt-in first ring-3 user program execution (QEMU-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_usermode == true }}
        run: |
          OVMF_PATH=""
          # Prefer unsigned, non-Secure-Boot OVMF and avoid find|head SIGPIPE under pipefail.
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-usermode OVMF_CODE="$OVMF_PATH"
      - name: Enforce M009 cooperative scheduler QEMU regression
        if: always()
        env:
          M009_OUTCOME: ${{ steps.scheduler_test.outcome }}
        run: |
          if [ "$M009_OUTCOME" != "success" ]; then
            echo "::error title=IndianOS M009 scheduler regression::Expected two live user contexts to switch fairly, got: $M009_OUTCOME"
            exit 1
          fi
          echo "IndianOS: M009 cooperative scheduler QEMU regression gate PASSED"
      - name: Enforce M008 sequential processes QEMU regression
        if: always()
        env:
          PROCESS_OUTCOME: ${{ steps.process_test.outcome }}
        run: |
          if [ "$PROCESS_OUTCOME" != "success" ]; then
            echo "::error title=IndianOS M008 process regression::Expected two successful user processes, got: $PROCESS_OUTCOME"
            exit 1
          fi
          echo "IndianOS: two-process QEMU regression gate PASSED"
      - name: Enforce ring-3 user fault isolation regression
        if: always()
        env:
          USERFAULT_OUTCOME: ${{ steps.userfault_test.outcome }}
        run: |
          if [ "$USERFAULT_OUTCOME" != "success" ]; then
            echo "::error title=IndianOS user fault isolation::QEMU guard/supervisor tests failed or were skipped: $USERFAULT_OUTCOME"
            exit 1
          fi
          echo "IndianOS: user fault isolation QEMU regression gate PASSED"
      - name: Enforce first native user program QEMU regression
        if: always()
        env:
          RING3_OUTCOME: ${{ steps.ring3_test.outcome }}
        run: |
          if [ "$RING3_OUTCOME" != "success" ]; then
            echo "::error title=IndianOS ring-3 regression::Expected the QEMU ring-3 test to pass, got: $RING3_OUTCOME"
            exit 1
          fi
          echo "IndianOS: ring-3 QEMU regression gate PASSED"
      - name: Opt-in guarded shadow CR3 switch (QEMU-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_shadow_switch == true }}
        run: |
          OVMF_PATH=""
          # Prefer unsigned, non-Secure-Boot OVMF and avoid find|head SIGPIPE under pipefail.
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-shadow OVMF_CODE="$OVMF_PATH"
