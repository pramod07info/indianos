            build-rust-runtime-qemu.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust boot-time VMM and user-image HHDM staging (candidate QEMU)
        id: rust_boot_staging
        continue-on-error: true
        run: |
          set -o pipefail
          OVMF_PATH=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$candidate"; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-boot-staging-qemu OVMF_CODE="$OVMF_PATH" 2>&1 | tee build-rust-boot-staging.log
      - name: Publish Rust boot staging status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_STAGING: ${{ steps.rust_boot_staging.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          outcome = os.getenv("BOOT_STAGING", "skipped")
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = json.dumps({
              "state": "success" if outcome == "success" else "failure",
              "context": "indianos/rust-boot-staging-qemu",
              "description": f"Rust HHDM boot staging: normal+two-process QEMU={outcome}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
