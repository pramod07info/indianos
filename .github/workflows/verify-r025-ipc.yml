name: Verify R025 usermode IPC in QEMU
on:
  push:
    branches: [agentx-verify-r025-ipc-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils xorriso qemu-system-x86 ovmf curl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: IPC syscall policy and kernel regression tests
        run: cargo test --offline --manifest-path rust/kernel_core/Cargo.toml --features test-ipc
      - name: Compile bare-metal IPC kernel
        run: cargo build --offline --manifest-path rust/kernel_core/Cargo.toml --target x86_64-unknown-none --no-default-features --features cpu-entry,vmm,pmm,user-image,paging,paging-cpu,user-runtime,runtime,boot-staging,boot,interrupts,timer,kernel-main,limine-requests,test-scheduler,test-ipc
      - name: Rust kernel source audit
        run: make test-rust-source-audit
      - name: QEMU two-process secure IPC handshake and negative tests
        shell: bash
        run: |
          set -euo pipefail
          OVMF_PATH=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE_4M.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if test -f "$f"; then OVMF_PATH="$f"; break; fi
          done
          test -n "$OVMF_PATH"
          make test-rust-ipc-qemu OVMF_CODE="$OVMF_PATH"
