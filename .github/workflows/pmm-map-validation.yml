name: pmm-map-validation
on:
  pull_request:
    branches: [main]
    paths:
      - "rust/kernel_core/src/pmm.rs"
      - ".github/workflows/pmm-map-validation.yml"
  push:
    branches: [main]
    paths:
      - "rust/kernel_core/src/pmm.rs"
      - ".github/workflows/pmm-map-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Feature-enabled host regression
        run: cargo test --locked --offline --manifest-path rust/kernel_core/Cargo.toml --lib --features pmm pmm::tests
      - name: Freestanding compilation
        run: cargo check --locked --offline --manifest-path rust/kernel_core/Cargo.toml --no-default-features --target x86_64-unknown-none --features pmm

