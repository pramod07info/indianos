[package]
name = "indianos-kernel-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "indianos_kernel_core"
crate-type = ["staticlib", "rlib"]

# No dependency registry, allocator, async runtime, or host OS services.
[dependencies]
ed25519-compact = { path = "vendor/ed25519-compact", default-features = false, optional = true }

[features]
# Unit tests use std; the actual bare-metal build explicitly disables it.
default = ["std"]
std = []
preempt = []
cpu-entry = []
vmm = []
pmm = []
user-image = ["vmm"]
paging = []
paging-cpu = ["paging", "boot"]
user-runtime = ["user-image", "paging-cpu", "timer", "interrupts"]
runtime = []
boot-staging = ["pmm", "user-image"]
boot = []
interrupts = []
timer = []
kernel-main = ["boot", "paging"]
limine-requests = ["boot"]
test-ata-disk = []
test-r027-durable = []
test-r028-network = []
# QEMU-exclusive mapped framebuffer GUI + polling PS/2 mouse and serial keyboard.
test-r029-desktop = ["test-interactive","kernel-main"]
# Ring-3 window-command client; framebuffer remains kernel-owned.
test-r029-userspace = ["test-r029-desktop","test-ring3"]
test-r029-physical-events = ["test-r029-userspace"]
# Two isolated ELF64 GUI programs, real PS2 input and verified PID grants.
test-r029-multiprocess = ["test-r029-physical-events","test-scheduler"]
# Two ring-3 processes; PID1 schedules framebuffer frames and stacking.
# The kernel stays a privileged, clipped pixel backend (not yet full user compositor).
test-r029-frame-server = ["test-r029-multiprocess"]
test-r029-desktop-suite = ["test-r029-frame-server","test-ipc"]
# R031.1: automatic QEMU desktop startup, privileged session manager and input.
test-r031-boot-desktop = ["test-r029-desktop-suite"]
# QEMU-only single restart of faulted Terminal with capability rotation.
test-r031-supervisor = ["test-r031-boot-desktop"]
# Opt-in QEMU-only R030.1 storage + R030.2 allowlisted native install / launch.
test-r030-ondevice = ["test-r026"]
# Bounded durable hierarchical VFS and metadata corruption recovery.
test-r031-vfs = ["test-r030-ondevice"]
# R031.9: opt-in persistent graphical Files + bounded PID2 read-only VFS.
test-r031-files-gui = ["test-r031-boot-desktop", "test-r031-vfs"]
# M2 native ABI/catalog, persistent signed-record inventory, app store model,
# and owner-gated network ingress tests; not a full live app-store/kernel.
test-m2-developer-alpha = ["test-r031-vfs", "dep:ed25519-compact"]
# Test-only disk-installed native process runtime on disposable QEMU IDE media.
test-m2-disk-exec = ["test-m2-developer-alpha","user-runtime"]
# R041 opt-in QEMU guest smoke; bounded workspace only, not ring3 desktop.
test-r041-workspace = ["kernel-main"]
test-ud2 = []
test-pagefault = []
test-shadow = []
test-ring3 = []
test-processes = []
test-scheduler = []
test-fault-guard = []
test-fault-supervisor = []
test-shell = []
test-interactive = ["test-shell", "user-runtime"]
test-ipc = ["user-runtime"]
# R026: persistent single-core interactive init, on-demand child launch.
test-r026 = ["test-interactive", "test-scheduler"]
test-r025 = ["test-ipc"]
test-irq-keyboard = ["test-interactive", "boot", "interrupts", "cpu-entry"]

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
overflow-checks = true

[profile.dev]
panic = "abort"
