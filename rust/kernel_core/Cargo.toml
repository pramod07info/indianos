[package]
name = "indianos-kernel-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "indianos_kernel_core"
crate-type = ["staticlib", "rlib"]

# No dependency registry, allocator, async runtime, or host OS services.
[dependencies]

[features]
# Unit tests use std; the actual bare-metal build explicitly disables it.
default = ["std"]
std = []
preempt = []
vmm = []
pmm = []
user-image = ["vmm"]
paging = []
paging-cpu = ["paging", "boot"]
user-runtime = ["user-image", "paging-cpu", "timer", "interrupts"]
runtime = []
boot-staging = ["pmm", "user-image"]
boot = []
interrupts = []
timer = []
kernel-main = ["boot", "paging"]
limine-requests = ["boot"]
test-ud2 = []
test-pagefault = []
test-shadow = []
test-ring3 = []
test-processes = []
test-scheduler = []
test-fault-guard = []
test-fault-supervisor = []

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
overflow-checks = true

[profile.dev]
panic = "abort"
